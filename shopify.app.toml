# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "REPLACE_WITH_CLIENT_ID"
name = "Ascend Ambassadors"
handle = "ascend-ambassadors"
application_url = "https://ascend-app-eight-bay.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[access_scopes]
# write_discounts is needed for Phase 3 (Discount Function codes); requested up
# front so merchants only see one consent screen.
scopes = "read_orders,read_customers,read_products,write_discounts"

[auth]
redirect_urls = [
  "https://ascend-app-eight-bay.vercel.app/auth/callback",
  "https://ascend-app-eight-bay.vercel.app/auth/login",
  "https://ascend-app-eight-bay.vercel.app/api/auth/callback"
]

[webhooks]
api_version = "2025-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled", "orders/create", "orders/updated", "refunds/create" ]
  uri = "/webhooks"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks"

[pos]
embedded = false
