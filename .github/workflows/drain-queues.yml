# Fallback queue-drain trigger for Vercel Hobby plans.
#
# vercel.json defines per-minute crons, but Hobby accounts only allow daily
# crons — if the Vercel deploy rejects the crons block (or you simply stay on
# Hobby), this workflow keeps the pgmq queues draining every ~5 minutes
# (GitHub's minimum schedule interval).
#
# Setup: add two repository secrets (Settings → Secrets and variables → Actions):
#   APP_URL      e.g. https://ascend-app.vercel.app  (no trailing slash)
#   CRON_SECRET  same value as the Vercel env var
# The job no-ops silently until both are set. Disable it once you're on Vercel
# Pro with native crons.

name: Drain queues

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: drain-queues
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Drain all queues
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets not configured — skipping."
            exit 0
          fi
          status=0
          for queue in webhooks imports emails discount_sync; do
            echo "Draining $queue…"
            curl --fail-with-body -sS --max-time 300 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/jobs/drain?queue=$queue" || status=1
          done
          exit $status
